<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
  <title>Motion Labs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pp: {
              darkest: '#1a1a1a',
              dark: '#232323',
              medium: '#2d2d2d',
              light: '#383838',
              lighter: '#424242',
              border: '#3d3d3d',
              'border-light': '#4a4a4a',
              text: '#cccccc',
              'text-dim': '#808080',
              'text-bright': '#e0e0e0',
              accent: '#448aff',
              'accent-hover': '#5c9aff',
              timecode: '#4e9fd5',
              'clip-video': '#4a7fb5',
              'clip-audio': '#4caf50',
              'clip-text': '#e57373',
              'clip-image': '#ab47bc',
              'clip-adjustment': '#ff9800',
              playhead: '#ff0000',
              'menu-bg': '#2b2b2b',
              'menu-hover': '#3a3a3a',
              'tab-active': '#1e1e1e',
              'tab-inactive': '#2d2d2d',
              'input-bg': '#1a1a1a',
              'input-border': '#3d3d3d',
              'button-bg': '#383838',
              'button-hover': '#4a4a4a',
            },
            gray: {
              750: '#2d3748',
              850: '#1a202c',
              950: '#0d1117',
            }
          },
          fontFamily: {
            'pp': ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
            'pp-mono': ['Menlo', 'Monaco', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pp-bg-darkest: #1a1a1a;
      --pp-bg-dark: #232323;
      --pp-bg-medium: #2d2d2d;
      --pp-bg-light: #383838;
      --pp-bg-lighter: #424242;
      --pp-border: #3d3d3d;
      --pp-border-light: #4a4a4a;
      --pp-text: #cccccc;
      --pp-text-dim: #808080;
      --pp-text-bright: #e0e0e0;
      --pp-accent: #448aff;
      --pp-accent-hover: #5c9aff;
      --pp-timecode: #4e9fd5;
      --pp-clip-video: #4a7fb5;
      --pp-clip-audio: #4caf50;
      --pp-clip-text: #e57373;
      --pp-playhead: #ff0000;
      --pp-menu-bg: #2b2b2b;
      --pp-menu-hover: #3a3a3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #cccccc;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-size: 12px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Premiere Pro style scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #3d3d3d;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4a4a4a;
    }

    ::-webkit-scrollbar-corner {
      background: #1a1a1a;
    }

    /* Premiere Pro panel tab styling */
    .pp-panel-tab {
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 3px 3px 0 0;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background-color 0.1s, color 0.1s;
    }

    .pp-panel-tab.active {
      background: #1e1e1e;
      color: #e0e0e0;
    }

    .pp-panel-tab:not(.active) {
      background: #2d2d2d;
      color: #808080;
    }

    .pp-panel-tab:not(.active):hover {
      color: #b0b0b0;
      background: #353535;
    }

    /* Premiere Pro button styling */
    .pp-btn {
      background: #383838;
      border: 1px solid #3d3d3d;
      color: #cccccc;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      transition: background-color 0.1s;
    }

    .pp-btn:hover {
      background: #4a4a4a;
    }

    .pp-btn.active {
      background: #448aff;
      border-color: #448aff;
      color: white;
    }

    /* Premiere Pro icon button */
    .pp-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 3px;
      cursor: pointer;
      color: #808080;
      transition: background-color 0.1s, color 0.1s;
      border: none;
      background: transparent;
    }

    .pp-icon-btn:hover {
      background: #3a3a3a;
      color: #e0e0e0;
    }

    .pp-icon-btn.active {
      color: #99c2ff;
      background: #0c4076;
      border-radius: 2px;
    }

    /* Transport button styling */
    .pp-transport-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 24px;
      border-radius: 2px;
      cursor: pointer;
      color: #808080;
      transition: color 0.1s;
      border: none;
      background: transparent;
    }

    .pp-transport-btn:hover {
      color: #e0e0e0;
    }

    /* Premiere Pro input styling */
    .pp-input {
      background: #1a1a1a;
      border: 1px solid #3d3d3d;
      color: #cccccc;
      border-radius: 3px;
      padding: 3px 6px;
      font-size: 11px;
      outline: none;
      transition: border-color 0.15s;
    }

    .pp-input:focus {
      border-color: #448aff;
    }

    /* Slider styling for Premiere Pro look */
    .pp-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      background: #3d3d3d;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .pp-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: #808080;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    .pp-slider::-webkit-slider-thumb:hover {
      background: #a0a0a0;
    }

    /* Premiere Pro panel border/divider */
    .pp-divider {
      background: #0d0d0d;
    }

    .pp-resize-handle {
      background: transparent;
      transition: background-color 0.15s;
    }

    .pp-resize-handle:hover {
      background: rgba(68, 138, 255, 0.4);
    }

    /* Timecode display */
    .pp-timecode {
      font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
      font-size: 12px;
      color: #4e9fd5;
      letter-spacing: 0.5px;
    }

    /* Shimmer animation for loading states */
    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* VU Meter gradient */
    .vu-meter-gradient {
      background: linear-gradient(to top, #4caf50 0%, #4caf50 60%, #ffeb3b 70%, #ff9800 85%, #f44336 95%);
    }

    /* Track header styling */
    .pp-track-header {
      background: #2d2d2d;
      border-bottom: 1px solid #1a1a1a;
      border-right: 1px solid #1a1a1a;
    }

    /* Clip colors */
    .pp-clip-video {
      background: linear-gradient(180deg, #5a8fc5 0%, #4a7fb5 50%, #3a6fa5 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pp-clip-audio {
      background: linear-gradient(180deg, #5cbf60 0%, #4caf50 50%, #3c9f40 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pp-clip-text {
      background: linear-gradient(180deg, #ef8383 0%, #e57373 50%, #d56363 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pp-clip-image {
      background: linear-gradient(180deg, #bb57cc 0%, #ab47bc 50%, #9b37ac 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Context menu styling */
    .pp-context-menu {
      background: #2d2d2d;
      border: 1px solid #4a4a4a;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      padding: 4px 0;
    }

    .pp-context-menu-item {
      padding: 4px 24px;
      font-size: 11px;
      color: #cccccc;
      cursor: pointer;
      white-space: nowrap;
    }

    .pp-context-menu-item:hover {
      background: #448aff;
      color: white;
    }

    .pp-context-menu-separator {
      height: 1px;
      background: #3d3d3d;
      margin: 4px 0;
    }

    /* ========= INSTANT TOOLTIP (body-level) ========= */
    #pp-tooltip {
      position: fixed;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 11px;
      font-weight: 400;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 4px 8px;
      border-radius: 3px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.06s ease;
      z-index: 99999;
      border: 1px solid #3a3a3a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      line-height: 1.3;
    }

    #pp-tooltip.visible {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="pp-tooltip"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
      // Instant tooltip system — renders at body level, never clipped
      (function () {
        var tip = document.getElementById('pp-tooltip');
        var currentTarget = null;

        function hide() {
          tip.classList.remove('visible');
          currentTarget = null;
        }

        function show(el) {
          currentTarget = el;
          var text = el.getAttribute('data-tip');
          if (!text) { hide(); return; }
          tip.textContent = text;
          tip.style.left = '-9999px';
          tip.style.top = '-9999px';
          tip.classList.add('visible');
          requestAnimationFrame(function () {
            var rect = el.getBoundingClientRect();
            var tipW = tip.offsetWidth;
            var tipH = tip.offsetHeight;
            var left = rect.left + rect.width / 2 - tipW / 2;
            var top = rect.top - tipH - 6;
            if (top < 4) top = rect.bottom + 6;
            if (left < 4) left = 4;
            if (left + tipW > window.innerWidth - 4) left = window.innerWidth - tipW - 4;
            tip.style.left = left + 'px';
            tip.style.top = top + 'px';
          });
        }

        // Primary: mouseover detects entering data-tip elements
        document.addEventListener('mouseover', function (e) {
          var el = e.target.closest ? e.target.closest('[data-tip]') : null;
          if (el) {
            if (el !== currentTarget) show(el);
          } else {
            if (currentTarget) hide();
          }
        });

        // Safety net: mousemove catches any missed transitions
        document.addEventListener('mousemove', function (e) {
          if (!currentTarget) return;
          var el = document.elementFromPoint(e.clientX, e.clientY);
          if (!el) { hide(); return; }
          var tipEl = el.closest ? el.closest('[data-tip]') : null;
          if (tipEl !== currentTarget) {
            if (tipEl) {
              show(tipEl);
            } else {
              hide();
            }
          }
        });

        // Also hide when mouse leaves the window entirely
        document.addEventListener('mouseleave', function () {
          if (currentTarget) hide();
        });
      })();
  </script>
</body>

</html>
